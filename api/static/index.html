<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copytrade Console</title><link rel="stylesheet" href="/static/app.css?v=5">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js" defer></script>
</head>
<body><main id="app"><header><div><small>YHR.LOL</small><h1>Copytrade Console</h1></div><div id="status" class="pill">Connecting</div></header>
<section id="dashboard"><nav class="tabs"><button class="tab active" data-page="monitor-page">Monitor</button><button class="tab" data-page="performance-page">Performance</button><button class="tab" data-page="config-page">Configuration</button></nav><section id="monitor-page"><div class="metrics"><div><small>Balance</small><strong id="equity">--</strong></div><div><small>Unrealized PnL</small><strong id="unrealized">--</strong></div><div><small>System status</small><strong id="mode">--</strong></div><div><small>Stop loss</small><strong id="stop-loss">--</strong></div></div><div class="toolbar"><h2>Execution account</h2><button id="toggle">Pause entries</button></div><div id="account" class="panel"></div><h2>Open orders</h2><div id="orders" class="panel"></div><h2>Leaders</h2><div id="leaders"></div></section><section id="performance-page" hidden><h2>Performance analysis</h2><div class="filters"><div class="chips" id="perf-presets"><button class="chip" data-preset="today">Today</button><button class="chip" data-preset="7d">7D</button><button class="chip" data-preset="30d">30D</button><button class="chip active" data-preset="all">All</button></div><div class="range"><label>From <input type="date" id="perf-since"></label><label>To <input type="date" id="perf-until"></label><button id="perf-apply">Apply</button></div></div><div id="performance"><p class="muted">Loading performance...</p></div></section><section id="config-page" hidden><h2>Trader configuration</h2><p class="muted">Changes apply to the running copytrade engine after validation.</p><div id="configs"></div></section></section></main><script src="/static/app.js?v=6"></script></body></html>
