<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copytrade Console</title><link rel="stylesheet" href="/static/app.css?v=3"></head>
<body><main id="app"><header><div><small>YHR.LOL</small><h1>Copytrade Console</h1></div><div id="status" class="pill">Connecting</div></header>
<section id="login" class="panel"><h2>Sign in</h2><form><input name="username" placeholder="Username" autocomplete="username"><input name="password" type="password" placeholder="Password" autocomplete="current-password"><button>Sign in</button><p id="login-error"></p></form></section>
<section id="dashboard" hidden><nav class="tabs"><button class="tab active" data-page="monitor-page">Monitor</button><button class="tab" data-page="config-page">Configuration</button></nav><section id="monitor-page"><div class="metrics"><div><small>Balance</small><strong id="equity">--</strong></div><div><small>Unrealized PnL</small><strong id="unrealized">--</strong></div><div><small>System status</small><strong id="mode">--</strong></div><div><small>Stop loss</small><strong id="stop-loss">--</strong></div></div><div class="toolbar"><h2>Execution account</h2><button id="toggle">Pause entries</button></div><div id="account" class="panel"></div><h2>Open orders</h2><div id="orders" class="panel"></div><h2>Leaders</h2><div id="leaders"></div></section><section id="config-page" hidden><h2>Trader configuration</h2><p class="muted">Changes apply to the running copytrade engine after validation.</p><div id="configs"></div></section></section></main><script src="/static/app.js?v=3"></script></body></html>
