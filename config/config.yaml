hyperliquid:
  ws_url: wss://api.hyperliquid.xyz/ws
  reconnect_seconds: 3
  addresses:
  - 64064471586051217767591609323470888316015842704
  - 124057809289343838766394089726074669611213617961
position_sources:
  binance_live:
    type: binance
    mode: hybrid
    browser:
      profile_dir: data/binance-browser-profile
      headless: true
      timeout_ms: 30000
    session:
      refresh_interval_hours: 4.0
      auth_probe_portfolio_id: '5275595931132915200'
polling:
  interval_seconds: 2.5
  jitter_ms: 500
execution_accounts:
  gate_primary:
    exchange: gate
    api_key: ${GATE_API_KEY}
    secret_key: ${GATE_SECRET_KEY}
    settle: usdt
    margin_mode: crossed
    leverage: 50
    dry_run: false
    hard_stop:
      max_daily_loss_usdt: 30
    fixed_balance_usdt: 120
  binance_primary:
    exchange: binance
    api_key: ${BINANCE_FUTURES_API_KEY}
    api_secret: ${BINANCE_FUTURES_API_SECRET}
    leverage: 25
    dry_run: false
    hard_stop:
      max_daily_loss_usdt: 40
      max_daily_drawdown_pct: 30
