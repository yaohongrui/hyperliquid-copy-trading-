hyperliquid:
  ws_url: wss://api.hyperliquid.xyz/ws
  reconnect_seconds: 3

execution_accounts:
  hl_primary:
    exchange: hyperliquid
    # The API wallet signs; positions and equity belong to this main account.
    account_address: '0xd38272Da1648a212559a09FB7083097f872A3Dd5'
    api_private_key: ${HL_API_PRIVATE_KEY}
    testnet: false
    leverage: 20
    dry_run: false
    hard_stop:
      max_daily_drawdown_pct: 30
    fixed_balance_usdt: 80
    request_timeout_seconds: 10

stop_out_cooldown_seconds: 600
# HIP-3 accounts read every dex from REST; keep reconciliation below the
# request budget (the dashboard has its own interval).
protection_reconcile_seconds: 15

# Copy a leader's resting limit orders as post-only orders at the exact same
# price.  Only leaders with ``mirror_orders: true`` participate; each such
# leader keeps at most ``max_orders`` live mirrors (default: the nearest order
# above and the nearest below the mark).  Market/taker fills still follow the
# normal market path.  ``shadow: true`` logs the selection without placing.
mirror_orders:
  enabled: true
  max_orders: 2
  post_only: true
  refresh_seconds: 5
  leader_orders_seconds: 10
  dex_probe_seconds: 120
  failure_cooldown_seconds: 30
  credit_grace_ms: 1200
  credit_ttl_seconds: 900
  shadow: false

console:
  database: data/console.sqlite3
  domain: yhr.lol
  leader_rest_seconds: 60
  dashboard_seconds: 15
  performance_seconds: 180
  performance_lookback_days: 30
  performance_overlap_seconds: 300
  performance_page_size: 2000
  snapshot_retention_days: 90

auto_breakeven:
  enabled: false

